name: research-polanow-h2-capture

on:
  push:
    branches:
      - research/polanow-h2-capture
    paths:
      - scripts/research-polanow-h2-capture.mjs
      - apps/worker/src/readiness/research-polanow-h2-runtime-text.ts
      - .github/workflows/research-polanow-h2-capture.yml

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enable pnpm
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Probe exact Polanów H2 attachments
        run: node scripts/research-polanow-h2-capture.mjs
      - name: Extract representative H2 text through production PDF.js path
        run: pnpm --filter @wastepl/worker exec tsx src/readiness/research-polanow-h2-runtime-text.ts
      - name: Upload capture evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: polanow-h2-capture-${{ github.run_id }}
          path: |
            tmp/polanow-h2-capture/
            tmp/polanow-h2-runtime-text/
          if-no-files-found: warn
          retention-days: 7
