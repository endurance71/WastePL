packages:
  - 'apps/*'
  - 'packages/*'

# Security overrides for transitive dependencies flagged by `pnpm audit --audit-level=high`.
overrides:
  # @nestjs/platform-fastify 11.x pins fastify 5.11.3 (GHSA-p68q-wchp-6fh7, GHSA-hwr6-493r-vm6h, GHSA-9q9j-q6p8-xq58).
  fastify: ^5.12.2
  # vitest 3.x depends on tinypool ^1; no 1.x patch exists (GHSA-5gmw-xhrv-c9v3, GHSA-85c8-ppgw-ccpr).
  tinypool: ^2.1.2
  brace-expansion@>=2 <3: ^2.1.6
  brace-expansion@>=5 <6: ^5.0.11
  fast-uri@>=3 <4: ^3.1.7
  fast-uri@>=4 <5: ^4.1.4
  source-map-js: ^1.2.2
