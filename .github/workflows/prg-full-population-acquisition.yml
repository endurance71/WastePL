name: prg-full-population-acquisition

on:
  push:
    branches:
      - data/prg-full-pilot-acquisition-20260907
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Acquire complete PRG population for 8 pilot municipalities
        run: pnpm --filter @wastepl/worker exec tsx src/reference/acquire-pilot-prg-snapshot.ts
      - name: Upload frozen acquisition evidence
        if: always()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: prg-full-pilot-acquisition-${{ github.run_id }}
          path: tmp/prg-full-population/
          if-no-files-found: error
          retention-days: 30
