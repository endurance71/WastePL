name: ci

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: wastepl
          POSTGRES_PASSWORD: wastepl
          POSTGRES_DB: wastepl
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wastepl -d wastepl"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://wastepl:wastepl@localhost:5432/wastepl
      PRODUCTION_GATE_DATABASE_URL: postgresql://wastepl:wastepl@localhost:5432/wastepl_production_gate
      REDIS_URL: redis://localhost:6379
      S3_ENDPOINT: http://localhost:9000
      S3_REGION: eu-central-1
      S3_BUCKET: wastepl-artifacts
      S3_ACCESS_KEY: minio
      S3_SECRET_KEY: change-me-now
      PORT: 3000

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - name: Start MinIO
        run: |
          docker run -d --name wastepl-minio \
            -p 9000:9000 \
            -e MINIO_ROOT_USER=minio \
            -e MINIO_ROOT_PASSWORD=change-me-now \
            minio/minio server /data --address ':9000'
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:9000/minio/health/live >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs wastepl-minio
          exit 1
      - run: pnpm install --frozen-lockfile
      - run: pnpm docs:check
      - run: pnpm contracts:check
      - run: pnpm db:migrate
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      - name: Run pilot readiness gates
        run: pnpm pilot:readiness
      - name: Run fixture-independent production pilot gate
        run: pnpm pilot:production-gate
      - name: Install Playwright browsers
        run: pnpm --filter @wastepl/pwa exec playwright install --with-deps chromium webkit
      - name: Run Playwright E2E & WCAG 2.2 AA a11y tests
        run: pnpm --filter @wastepl/pwa test:e2e
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/pwa/test-results/playwright-report.json
          if-no-files-found: warn
      - name: Upload pilot readiness reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pilot-readiness-reports
          path: |
            apps/worker/test-results/pilot-readiness-report.json
            apps/worker/test-results/pilot-readiness-2026.2-report.json
          if-no-files-found: warn
      - name: Upload production pilot readiness reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-pilot-readiness-report
          path: |
            apps/worker/test-results/production-pilot-readiness-report.json
            apps/worker/test-results/tychowo-production-gate-report.json
          if-no-files-found: warn
      - name: Upload golden mismatch report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: golden-mismatch-report
          path: apps/api/test-results/golden-mismatch-report.json
          if-no-files-found: warn
      - name: Upload golden facility mismatch report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: golden-facility-mismatch-report
          path: apps/api/test-results/golden-facility-mismatch-report.json
          if-no-files-found: warn
      - name: Smoke-test API health endpoint
        run: |
          pnpm --filter @wastepl/api start > /tmp/wastepl-api.log 2>&1 &
          API_PID=$!
          node - <<'NODE'
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
          for (let attempt = 1; attempt <= 20; attempt += 1) {
            try {
              const response = await fetch('http://127.0.0.1:3000/v1/health');
              if (response.ok) {
                const body = await response.json();
                if (body.status !== 'ok') throw new Error(`Unexpected body: ${JSON.stringify(body)}`);
                console.log(body);
                process.exit(0);
              }
            } catch (error) {
              if (attempt === 20) throw error;
            }
            await sleep(500);
          }
          throw new Error('API did not become healthy');
          NODE
          kill "$API_PID"
      - name: Stop MinIO
        if: always()
        run: docker rm -f wastepl-minio || true
