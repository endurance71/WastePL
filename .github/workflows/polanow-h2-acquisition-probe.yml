name: polanow-h2-acquisition-probe

on:
  push:
    branches:
      - probe/polanow-h2-acquisition

permissions:
  contents: read

jobs:
  acquisition:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --no-frozen-lockfile
      - name: Build and typecheck worker
        run: |
          pnpm --filter @wastepl/domain build
          pnpm --filter @wastepl/worker build
          pnpm --filter @wastepl/worker typecheck
      - name: Capture current Polanów H2 attachments
        run: pnpm --filter @wastepl/worker readiness:polanow-acquisition
      - name: Upload acquisition report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: polanow-h2-acquisition-report-${{ github.run_id }}
          path: apps/worker/test-results/polanow-h2-acquisition-report.json
          if-no-files-found: error
