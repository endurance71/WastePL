# WastePL Production & Staging Blueprint
# All container versions are strictly pinned. Network isolation and persistent volume bindings are enforced.
# Public services (Reverse Proxy / TLS) terminate traffic and forward to internal docker networks.
# Databases and storage (PostgreSQL, Redis, MinIO) are isolated in the backend network without host port binds.

services:
  postgres:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-wastepl}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-in-production}
      POSTGRES_DB: ${POSTGRES_DB:-wastepl}
    # Database port is bound only to loopback for secure administrative access (e.g. migrations / backups)
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-wastepl} -d ${POSTGRES_DB:-wastepl}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - wastepl-backend

  redis:
    image: redis:7.2.4-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-change-in-production}
    # Redis port is bound only to loopback for secure administrative inspection
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_prod_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-change-in-production}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - wastepl-backend

  minio:
    # minio/minio images were removed from Docker Hub and quay.io; Chainguard builds MinIO from source.
    # The free tier only publishes floating tags, so the multi-arch index is pinned by digest.
    # latest-dev (MinIO RELEASE.2026-09-22T19-25-18Z) ships wget for the healthcheck.
    image: cgr.dev/chainguard/minio:latest-dev@sha256:9044eb78c8519301ccc99f35fa752bebd1c61519fd6a4e056b8005391f624eae
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-wastepl-storage}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-in-production}
    # MinIO console & S3 API ports bound only to loopback for administrative access
    ports:
      - "127.0.0.1:${MINIO_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_prod_data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - wastepl-backend

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://${POSTGRES_USER:-wastepl}:${POSTGRES_PASSWORD:-change-in-production}@postgres:5432/${POSTGRES_DB:-wastepl}
      REDIS_URL: redis://:${REDIS_PASSWORD:-change-in-production}@redis:6379
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:kontakt@wastepl.pl}
    # API exposed internally to proxy; loopback fallback for local smoke-tests
    ports:
      - "127.0.0.1:${API_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - wastepl-backend
      - wastepl-frontend

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-wastepl}:${POSTGRES_PASSWORD:-change-in-production}@postgres:5432/${POSTGRES_DB:-wastepl}
      REDIS_URL: redis://:${REDIS_PASSWORD:-change-in-production}@redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_REGION: eu-central-1
      S3_BUCKET: ${S3_BUCKET:-wastepl-artifacts}
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-wastepl-storage}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-change-in-production}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:kontakt@wastepl.pl}
      ARTIFACT_PROCESSING_ENABLED: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - wastepl-backend

  pwa:
    build:
      context: .
      dockerfile: apps/pwa/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PWA_PORT:-8080}:80"
    networks:
      - wastepl-frontend

  caddy:
    image: caddy:2.8.4-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-staging.wastepl.pl}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - pwa
    networks:
      - wastepl-frontend

networks:
  wastepl-backend:
    driver: bridge
  wastepl-frontend:
    driver: bridge

volumes:
  postgres_prod_data:
  redis_prod_data:
  minio_prod_data:
  caddy_data:
  caddy_config:
