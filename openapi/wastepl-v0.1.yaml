openapi: 3.1.0
info:
  title: WastePL API
  version: 0.1.0
  description: Vendor-neutral municipal waste data API for Poland.
servers:
  - url: https://api.wastepl.pl
  - url: http://localhost:3000
paths:
  /v1/health:
    get:
      operationId: getHealth
      responses:
        '200':
          description: Healthy
          content:
            application/json:
              schema:
                type: object
                required: [status, time]
                properties:
                  status: { type: string, const: ok }
                  time: { type: string, format: date-time }
  /v1/addresses/resolve:
    get:
      operationId: resolveAddress
      parameters:
        - in: query
          name: query
          required: true
          schema: { type: string, minLength: 3 }
      responses:
        '200':
          description: Candidate canonical addresses
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddressResolveResponse'
        '400': { description: Invalid or too-short address query }
  /v1/collection:
    get:
      operationId: getCollectionSchedule
      parameters:
        - in: query
          name: addressId
          schema: { type: string, format: uuid }
        - in: query
          name: address
          schema: { type: string, minLength: 3 }
        - in: query
          name: from
          schema: { type: string, format: date }
        - in: query
          name: days
          schema: { type: integer, minimum: 1, maximum: 365, default: 90 }
      responses:
        '200':
          description: Collection schedule
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionScheduleResponse'
        '400': { description: Invalid address selector, date or schedule window }
        '404': { description: Address, service area or published schedule not found }
        '409': { description: Ambiguous canonical address or service-area resolution }
  /v1/facilities:
    get:
      operationId: listFacilities
      description: Returns source-backed PSZOK and deposit-return facilities. `openNow` is intentionally not exposed. Stale operational assertions degrade to UNKNOWN.
      parameters:
        - in: query
          name: kind
          schema:
            type: string
            enum: [PSZOK, DEPOSIT_RVM, DEPOSIT_MANUAL, ELECTRONICS, TEXTILES, BATTERIES, MEDICINES, OTHER]
        - in: query
          name: terc
          schema: { type: string, pattern: '^\\d{4,10}$' }
        - in: query
          name: material
          schema:
            type: string
            enum: [MIXED, BIO, PAPER, GLASS, METALS_PLASTICS, GREEN, BULKY, ASH, TEXTILES, ELECTRONICS, BATTERIES, MEDICINES, CONSTRUCTION, RUBBLE, TYRES, HAZARDOUS, OTHER]
        - in: query
          name: container
          schema:
            type: string
            enum: [PET_BOTTLE, METAL_CAN, REUSABLE_GLASS_BOTTLE]
        - in: query
          name: bbox
          description: minLon,minLat,maxLon,maxLat in EPSG:4326.
          schema: { type: string }
        - in: query
          name: lat
          schema: { type: number, minimum: -90, maximum: 90 }
        - in: query
          name: lon
          schema: { type: number, minimum: -180, maximum: 180 }
        - in: query
          name: radiusMeters
          schema: { type: number, minimum: 1, maximum: 100000 }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - in: query
          name: offset
          schema: { type: integer, minimum: 0, maximum: 100000, default: 0 }
      responses:
        '200':
          description: Source-backed facilities ordered deterministically; radius queries sort by distance.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FacilitiesResponse'
        '400': { description: Invalid filter, geometry, radius or pagination input }
components:
  schemas:
    Municipality:
      type: object
      required: [id, terc, name]
      properties:
        id: { type: string, format: uuid }
        terc: { type: string }
        name: { type: string }
    Address:
      type: object
      required: [id, canonicalText, municipality]
      properties:
        id: { type: string, format: uuid }
        prgId: { type: [string, 'null'] }
        canonicalText: { type: string }
        municipality: { $ref: '#/components/schemas/Municipality' }
    AddressCandidate:
      type: object
      required: [address, score]
      properties:
        address: { $ref: '#/components/schemas/Address' }
        score: { type: number, minimum: 0, maximum: 1 }
    AddressResolveResponse:
      type: object
      required: [query, items]
      properties:
        query: { type: string }
        items:
          type: array
          items: { $ref: '#/components/schemas/AddressCandidate' }
    CollectionEvent:
      type: object
      required: [date, fraction, status]
      properties:
        date: { type: string, format: date }
        fraction: { type: string }
        status: { type: string, enum: [SCHEDULED, CHANGED, CANCELLED, COMPLETED] }
    CollectionScheduleResponse:
      type: object
      required: [address, municipality, serviceArea, events, source, quality]
      properties:
        address: { $ref: '#/components/schemas/Address' }
        municipality: { $ref: '#/components/schemas/Municipality' }
        serviceArea:
          type: object
          required: [id, name]
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
        events:
          type: array
          items: { $ref: '#/components/schemas/CollectionEvent' }
        source:
          type: object
          required: [url, format]
          properties:
            url: { type: string, format: uri }
            format: { type: string }
        quality:
          type: object
          required: [verificationStatus, confidence, retrievedAt]
          properties:
            verificationStatus: { type: string, enum: [VERIFIED, OFFICIAL_SOURCE, UNVERIFIED, REVIEW_REQUIRED] }
            confidence: { type: number, minimum: 0, maximum: 1 }
            retrievedAt: { type: string, format: date-time }
            warnings: { type: array, items: { type: string } }
    FacilitySourceRef:
      type: object
      required: [artifactId, url, format, retrievedAt, parserKey, parserVersion]
      properties:
        artifactId: { type: string, format: uuid }
        url: { type: string, format: uri }
        format: { type: string }
        retrievedAt: { type: string, format: date-time }
        parserKey: { type: [string, 'null'] }
        parserVersion: { type: [string, 'null'] }
    NullableFacilitySourceRef:
      oneOf:
        - $ref: '#/components/schemas/FacilitySourceRef'
        - type: 'null'
    FacilityAssertionFreshnessRef:
      type: object
      additionalProperties: false
      required: [assertionId, sourceArtifactId, sourceKey, sourceAuthority, retrievedAt, staticFreshnessState, operationalStatusStale, externalIds]
      properties:
        assertionId: { type: string, format: uuid }
        sourceArtifactId: { type: string, format: uuid }
        sourceKey: { type: string }
        sourceAuthority: { type: integer, minimum: 0, maximum: 1000 }
        retrievedAt: { type: string, format: date-time }
        staticFreshnessState: { type: string, enum: [CURRENT, STALE] }
        operationalStatusStale: { type: boolean }
        externalIds:
          type: array
          items: { type: object, additionalProperties: true }
    FacilityItem:
      type: object
      additionalProperties: false
      required: [id, canonicalKey, kind, name, address, location, distanceMeters, externalIds, acceptedMaterials, acceptedContainers, openingHours, access, operationalStatus, operatorName, rulesUrl, quality, provenance]
      properties:
        id: { type: string, format: uuid }
        canonicalKey: { type: [string, 'null'] }
        kind: { type: string, enum: [PSZOK, DEPOSIT_RVM, DEPOSIT_MANUAL, ELECTRONICS, TEXTILES, BATTERIES, MEDICINES, OTHER] }
        name: { type: string }
        address: { type: [string, 'null'] }
        location:
          oneOf:
            - type: object
              additionalProperties: false
              required: [lat, lon]
              properties:
                lat: { type: number, minimum: -90, maximum: 90 }
                lon: { type: number, minimum: -180, maximum: 180 }
            - type: 'null'
        distanceMeters: { type: [number, 'null'], minimum: 0 }
        externalIds:
          type: array
          items: { type: object, additionalProperties: true }
        acceptedMaterials:
          type: array
          items: { type: string }
        acceptedContainers:
          type: array
          items: { type: string, enum: [PET_BOTTLE, METAL_CAN, REUSABLE_GLASS_BOTTLE] }
        openingHours:
          oneOf:
            - type: object
              additionalProperties: true
            - type: 'null'
        access:
          type: object
          additionalProperties: false
          required: [scope, requiresProof, rules]
          properties:
            scope: { type: string }
            requiresProof: { type: [boolean, 'null'] }
            rules: { type: object, additionalProperties: true }
        operationalStatus:
          type: object
          additionalProperties: false
          required: [state, observedAt]
          properties:
            state: { type: string, enum: [OPERATIONAL, TEMPORARILY_UNAVAILABLE, UNKNOWN] }
            observedAt: { type: [string, 'null'], format: date-time }
        operatorName: { type: [string, 'null'] }
        rulesUrl: { type: [string, 'null'], format: uri }
        quality:
          type: object
          additionalProperties: false
          required: [verificationStatus, confidence, retrievedAt, warnings]
          properties:
            verificationStatus: { type: string, enum: [VERIFIED, OFFICIAL_SOURCE, UNVERIFIED, REVIEW_REQUIRED] }
            confidence: { type: number, minimum: 0, maximum: 1 }
            retrievedAt: { type: string, format: date-time }
            warnings: { type: array, items: { type: string } }
        provenance:
          type: object
          additionalProperties: false
          required: [primary, location, openingHours, access, operationalStatus, assertions]
          properties:
            primary: { $ref: '#/components/schemas/FacilitySourceRef' }
            location: { $ref: '#/components/schemas/NullableFacilitySourceRef' }
            openingHours: { $ref: '#/components/schemas/NullableFacilitySourceRef' }
            access: { $ref: '#/components/schemas/NullableFacilitySourceRef' }
            operationalStatus: { $ref: '#/components/schemas/NullableFacilitySourceRef' }
            assertions:
              type: array
              items: { $ref: '#/components/schemas/FacilityAssertionFreshnessRef' }
    FacilitiesResponse:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/FacilityItem' }
        page:
          type: object
          additionalProperties: false
          required: [limit, offset, nextOffset]
          properties:
            limit: { type: integer, minimum: 1, maximum: 200 }
            offset: { type: integer, minimum: 0 }
            nextOffset: { type: [integer, 'null'], minimum: 0 }
