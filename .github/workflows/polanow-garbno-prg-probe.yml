name: polanow-garbno-prg-probe

on:
  push:
    branches:
      - probe/polanow-garbno-prg

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Query official GUGiK PRG WFS
        run: node scripts/probe-polanow-garbno-prg.mjs
      - name: Upload frozen probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: polanow-garbno-prg-${{ github.run_id }}
          path: |
            test-results/polanow-garbno-prg-report.json
            test-results/polanow-garbno-prg.gml
          if-no-files-found: error
